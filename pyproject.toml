[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire_agent"
version = "0.1.0"
description = "Multi-Drone Wildfire Suppression RL Environment"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pygame>=2.5.0",
    "gymnasium>=0.29.0",
    "pyyaml>=6.0"
]

[tool.setuptools.packages.find]
where = ["src"]
